<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Forno Paradiso · Il pranzo di oggi</title>

<!--
  ================================================================
   MENU DEL GIORNO — MODIFICA SOLO TRA LE DUE RIGHE QUI SOTTO
  ================================================================
   Come si scrive (una riga per piatto, come sulla lavagna):
     # 10 €            -> gruppo di piatti con il suo prezzo
     # Dolci           -> gruppo con un titolo invece del prezzo
     Nome piatto       -> un piatto
     Nome | 12€        -> un piatto con il suo prezzo a destra
     ! Testo           -> nota nel timbro in fondo
   Quello che segue un "+" (es. "+ contorno") esce più piccolo.
   Le righe vuote non contano.
  ================================================================
-->
<script type="text/plain" id="menu-del-giorno">

# 10 €
Zuppa di farro e legumi
Lasagna / Parmigiana
Risotto zucca e rosmarino

# 12 €
Lasagna "Paradiso"
Polpette in umido + contorno
Cotoletta con patate
Polpette di melanzane + contorni

! Il caffè è offerto!

</script>
<!-- ================================================================ -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;0,9..144,800;1,9..144,400;1,9..144,500&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<meta name="theme-color" content="#FBF4E6">
<style>
  :root{
    --grano:#FDB94E; --lava:#CC4635; --golfo:#28A0CF; --vesuvio:#3C6F30;
    --carta:#FBF4E6; --cenere:#15110C; --seppia:#7A6A55;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--carta);color:var(--cenere);font-family:'Fraunces',Georgia,serif;
    -webkit-font-smoothing:antialiased;min-height:100vh}

  /* cornice rossa come un cartoncino da tavola */
  .foglio{max-width:520px;margin:0 auto;min-height:100vh;border:solid var(--lava);
    border-width:10px 10px 0;padding:30px 24px 0;position:relative;display:flex;flex-direction:column}
  @media (min-width:560px){.foglio{margin:24px auto;min-height:0;border-width:10px}}

  header{text-align:center}
  .logo{width:132px;height:auto;margin:0 auto}
  .occhiello{font-family:'Nunito',sans-serif;font-weight:900;font-size:.72rem;letter-spacing:.28em;
    text-transform:uppercase;color:var(--lava);margin-top:22px}
  h1{font-weight:800;font-size:2.6rem;line-height:1;letter-spacing:-.02em;margin-top:6px;
    font-variation-settings:"opsz" 144}
  h1 em{font-weight:400;font-style:italic;color:var(--lava)}

  /* gruppi di piatti: prezzo grande a sinistra, piatti a destra */
  .gruppi{margin-top:30px;border-top:2px solid var(--cenere)}
  .gruppo{display:grid;grid-template-columns:76px 1fr;gap:0 16px;padding:20px 0 18px;
    border-bottom:1px solid rgba(21,17,12,.2)}
  .gruppo:last-child{border-bottom:2px solid var(--cenere)}
  .prezzo{font-weight:800;font-size:2.9rem;line-height:.82;color:var(--lava);letter-spacing:-.03em;
    font-variation-settings:"opsz" 144;padding-top:4px}
  .prezzo small{display:block;font-size:.95rem;font-weight:700;letter-spacing:0;margin-top:6px;color:var(--cenere)}
  .titolo{font-family:'Nunito',sans-serif;font-weight:900;font-size:.8rem;letter-spacing:.18em;
    text-transform:uppercase;color:var(--lava);padding-top:8px}
  .gruppo ul{list-style:none}
  .gruppo li{display:flex;align-items:baseline;gap:10px;padding:7px 0;font-size:1.22rem;
    font-weight:500;line-height:1.2}
  .gruppo li .nm{flex:1}
  .gruppo li .agg{display:block;font-style:italic;font-weight:400;font-size:.92rem;color:var(--seppia);margin-top:2px}
  .gruppo li .pr{font-weight:700;color:var(--lava);white-space:nowrap}

  /* timbro per la nota */
  .timbri{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:30px}
  .timbro{transform:rotate(-4deg);border:2.5px solid var(--lava);outline:1.5px solid var(--lava);outline-offset:3px;
    color:var(--lava);padding:9px 16px;font-family:'Nunito',sans-serif;font-weight:900;text-transform:uppercase;
    letter-spacing:.08em;font-size:.95rem;text-align:center}

  .allergeni{margin:28px 0 34px;font-style:italic;font-size:.9rem;color:var(--seppia);text-align:center;line-height:1.45}

  /* il mare del logo */
  .mare{margin:auto -24px 0;height:46px;flex:0 0 auto;
    background:repeating-linear-gradient(to bottom,var(--golfo) 0 4px,transparent 4px 9px)}
  footer{margin:0 -24px;background:var(--golfo);color:var(--carta);text-align:center;padding:4px 24px 26px}
  footer .dove{font-family:'Nunito',sans-serif;font-weight:900;text-transform:uppercase;letter-spacing:.14em;font-size:.82rem}
  footer .quando{font-size:1.02rem;margin-top:8px;line-height:1.5}
  footer .quando em{font-style:italic}
  footer a{display:inline-block;margin-top:14px;color:var(--carta);font-size:.95rem;font-style:italic;
    text-underline-offset:3px}
</style>
</head>
<body>
<div class="foglio">
  <header>
    <img class="logo" src="logo.png" alt="Forno Paradiso">
    <p class="occhiello">Il pranzo di oggi</p>
    <h1>Si mangia <em>da Dio</em></h1>
  </header>

  <main class="gruppi" id="menu"></main>
  <div class="timbri" id="note"></div>

  <p class="allergeni">Per gli allergeni chiedi a noi:<br>ti raccontiamo ogni piatto.</p>

  <div class="mare" aria-hidden="true"></div>
  <footer>
    <p class="dove">Milano · Via Benedetto Marcello</p>
    <p class="quando">Pranzo dal lunedì al sabato, 12–15<br><em>Da asporto tutto il giorno, dalle 11</em></p>
    <a href="https://www.instagram.com/fornoparadiso/" target="_blank" rel="noopener">@fornoparadiso su Instagram</a>
  </footer>
</div>

<script>
(function(){
  var righe = document.getElementById('menu-del-giorno').textContent.split('\n');
  var menu = document.getElementById('menu'), note = document.getElementById('note');
  var lista = null;
  function el(tag, cls, testo){ var e=document.createElement(tag); if(cls) e.className=cls; if(testo!=null) e.textContent=testo; return e; }
  function bello(t){ return t.replace(/"([^"]*)"/g,'“$1”').replace(/'/g,'’'); }
  function nuovoGruppo(titolo){
    var g = el('section','gruppo'), testa;
    var m = titolo && titolo.match(/^(\d+(?:[.,]\d+)?)\s*€$/);
    if(m){ testa = el('div','prezzo',m[1]); testa.appendChild(el('small',null,'euro')); }
    else { testa = el('div','titolo',titolo || ''); }
    g.appendChild(testa); lista = el('ul'); g.appendChild(lista); menu.appendChild(g);
  }
  righe.forEach(function(r){
    var t = r.trim();
    if(!t) return;
    if(t.charAt(0)==='#'){ nuovoGruppo(t.replace(/^#+\s*/,'')); return; }
    if(t.charAt(0)==='!'){ note.appendChild(el('div','timbro',bello(t.replace(/^!\s*/,'')))); return; }
    if(!lista) nuovoGruppo('');
    var parti = t.split('|'), nome = bello(parti[0].trim()), li = el('li');
    var piu = nome.indexOf(' + '), nm = el('span','nm', piu>0 ? nome.slice(0,piu) : nome);
    if(piu>0) nm.appendChild(el('span','agg', 'con ' + nome.slice(piu+3)));
    li.appendChild(nm);
    if(parti.length>1 && parti[1].trim()) li.appendChild(el('span','pr',parti.slice(1).join('|').trim()));
    lista.appendChild(li);
  });
})();
</script>
</body>
</html>
